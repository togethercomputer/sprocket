[project]
name = "sprocket-wan2-1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "diffusers==0.33.0",
    "transformers==4.49.0",
    "para_attn==0.3.38",
    "ftfy==6.3.1",
    "accelerate==1.13.0",
    "einops==0.8.2",
    "omegaconf==2.3.0",
    "pillow==12.2.0",
    "ffmpeg-python==0.2.0",
    "opencv-python==4.13.0.92",
    "torch==2.6.0",
    "sprocket==0.1.4",
]

[[tool.uv.index]]
name = "together-pypi"
url = "https://pypi.together.ai/"

[tool.uv.sources]
sprocket = { index = "together-pypi" }

[tool.jig.image]
python_version = "3.11"
system_packages = ["libgl1", "libglx-mesa0", "ffmpeg"]
cmd = "python3 run_wan.py --queue"
auto_include_git = false
copy = ["run_wan.py"]

[tool.jig.deploy.environment_variables]
TERMINATION_GRACE_PERIOD_SECONDS = "1800"

[tool.jig.deploy]
description = "Wan2.1 Video Generation with Sprocket"
gpu_type = "h100-80gb"
gpu_count = 2
cpu = 4
memory = 32
port = 8000
min_replicas = 1
max_replicas = 1
