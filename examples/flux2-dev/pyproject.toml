[project]
name = "sprocket-flux2-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "diffusers==0.37.1",
    "transformers==4.57.1",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "pillow==12.2.0",
    "accelerate==1.13.0",
    "safetensors==0.7.0",
    "sprocket==0.1.4",
]

[[tool.uv.index]]
name = "together-pypi"
url = "https://pypi.together.ai/"

[tool.uv.sources]
sprocket = { index = "together-pypi" }

[tool.jig.image]
python_version = "3.11"
cmd = "python3 run.py --queue"
auto_include_git = false
copy = ["run.py"]

[tool.jig.deploy]
description = "Flux2-dev Image Generation with Sprocket"
gpu_type = "h100-80gb"
gpu_count = 1
cpu = 4
memory = 32
storage = 50
port = 8000
min_replicas = 1
max_replicas = 1
